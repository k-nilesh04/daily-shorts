name: Daily Video

on:
  schedule:
    - cron: "30 3 * * *"        # 03:30 UTC = 09:00 IST. GitHub may start it 5-20 min late.
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube? (false = render only, saved as artifact)"
        type: boolean
        default: false

permissions:
  contents: write                # needed to commit data/history.json

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload == true) && secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' && secrets.YT_REFRESH_TOKEN != '' }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload != true) || (github.event_name == 'schedule' && (secrets.YT_CLIENT_ID == '' || secrets.YT_CLIENT_SECRET == '' || secrets.YT_REFRESH_TOKEN == '')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages (FFmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Offline smoke test
        run: python -m unittest discover -s tests

      - name: Check upload credentials before paid generation
        if: github.event_name == 'workflow_dispatch' && inputs.upload == true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "YouTube upload credentials not found; bypassing upload (render-only mode)."
          fi

      - name: Explain scheduled render-only mode
        if: github.event_name == 'schedule' && env.DRY_RUN == 'true'
        run: echo "YouTube upload credentials are incomplete; this scheduled run will render placeholders without paid video generation."

      - name: Generate video
        env:
          UPLOAD: ${{ env.UPLOAD }}
          DRY_RUN: ${{ env.DRY_RUN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER }}
          JSON2VIDEO_IMAGE_URL: ${{ vars.JSON2VIDEO_IMAGE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          NICHE: ${{ vars.NICHE }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS }}
          PRIVACY_STATUS: ${{ vars.PRIVACY_STATUS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_VIDEO_MAX_USD: ${{ vars.AI_VIDEO_MAX_USD }}
          LAYOUT: ${{ vars.LAYOUT }}
          HEADER_TITLE: ${{ vars.HEADER_TITLE }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
        run: python -m src.main

      - name: Save video + metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: video-${{ github.run_number }}
          path: |
            output/video.mp4
            output/meta.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "chore: update topic history" && git push)
